  <style>
    /* ========================================================================
       BẢNG MÀU THÂN THIỆN CHO NGƯỜI DÙNG PHỔ THÔNG (SÁNG & TỐI)
       ======================================================================== */
    :root,
    [data-theme="light"] {
      --bg-canvas: #F4F6FA;
      --bg-surface: #FFFFFF;
      --bg-elevated: #EEF2F7;
      --border-subtle: #E2E8F0;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --brand: #2563EB;
      --brand-hover: #1D4ED8;
      --brand-soft: #EFF6FF;
      --brand-fg: #FFFFFF;
      --income: #059669;
      --expense: #E11D48;
      --warn: #D97706;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.03);
      --shadow-float: 0 16px 40px rgba(15, 23, 42, 0.14);
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg-canvas: #0B1120;
      --bg-surface: #111827;
      --bg-elevated: #1E293B;
      --border-subtle: #283548;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --brand: #3B82F6;
      --brand-hover: #2563EB;
      --brand-soft: rgba(59, 130, 246, 0.15);
      --brand-fg: #FFFFFF;
      --income: #10B981;
      --expense: #FB7185;
      --warn: #FBBF24;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-float: 0 20px 44px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, button, input, select, textarea {
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Căn thẳng cột mọi con số tiền tệ VNĐ, ngày tháng và đồng hồ */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Ô nhập liệu thân thiện, vùng chạm rộng rãi */
    .kt-input {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1.5px solid var(--border-subtle);
      border-radius: 0.875rem;
      font-size: 0.9375rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .kt-input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }

    /* Thanh cuộn tinh gọn */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.55);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeSlideUp 0.18s ease-out both;
    }
  </style>
</head>

  <!-- ======================================================================
       LOGIC ỨNG DỤNG EVERYDAY (CHẾ ĐỘ CÁ NHÂN MẶC ĐỊNH + TÙY CHỌN DÙNG CHUNG)
       ====================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,

      onSnapshot,

    /* ========================================================================
       1. HẰNG SỐ PHÂN LOẠI PHỔ THÔNG, DỄ HIỂU
       ======================================================================== */
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'everyday-public-app';

    try {

        { id: 'entertainment', name: 'Giải trí', icon: 'sparkles', color: '#0D9488' },
        { id: 'other_exp', name: 'Chi khác', icon: 'tag', color: '#64748B' },
      ],
      income: [
        { id: 'salary', name: 'Lương', icon: 'briefcase', color: '#059669' },
        { id: 'bonus', name: 'Thưởng', icon: 'gift', color: '#10B981' },
        { id: 'business', name: 'Kinh doanh', icon: 'trending-up', color: '#2563EB' },
        { id: 'investment', name: 'Đầu tư', icon: 'landmark', color: '#7C3AED' },
        { id: 'other_inc', name: 'Thu khác', icon: 'plus-circle', color: '#64748B' },
      ],
      transfer: [
        { id: 'transfer', name: 'Chuyển ví', icon: 'arrow-left-right', color: '#2563EB' },
      ]
    };

    const WALLET_ICONS = {
      cash: 'banknote',
      bank: 'landmark',
      ewallet: 'smartphone',
    };

    const COUNTDOWN_CATEGORIES = [
      { id: 'birthday', name: 'Sinh nhật', icon: 'cake', color: '#D97706' },
      { id: 'anniversary', name: 'Kỷ niệm', icon: 'heart', color: '#E11D48' },
      { id: 'travel', name: 'Du lịch', icon: 'plane', color: '#2563EB' },
      { id: 'milestone', name: 'Cột mốc', icon: 'flag', color: '#7C3AED' },
      { id: 'finance', name: 'Mục tiêu', icon: 'piggy-bank', color: '#059669' },
      { id: 'other', name: 'Sự kiện khác', icon: 'sparkles', color: '#475569' },
    ];

    /* ========================================================================
       2. TRẠNG THÁI DỮ LIỆU & CHẾ ĐỘ LƯU TRỮ (CÁ NHÂN MẶC ĐỊNH CHO PUBLIC)
       ======================================================================== */
    let db = null;
    let auth = null;
    let currentUser = null;
    let unsubscribeData = null;
    let hasReceivedFirstSnapshot = false;
    const seededScopes = new Set();
    const lastSnapshotMap = new Map();

    // Mặc định mỗi người dùng public có không gian CÁ NHÂN RIÊNG TƯ
    // Ai muốn dùng chung (gia đình/nhóm) có thể bật chế độ 'shared' trong Cài đặt
    const syncState = {
      status: 'connecting', // 'connecting' | 'connected' | 'local' | 'error'
      mode: 'personal',     // 'personal' (mặc định an toàn khi public) | 'shared'
      spaceCode: '',        // Chỉ dùng khi mode === 'shared'
      memberName: 'Tôi',
      theme: 'light',
      hideWelcome: false,
      lastSyncedAt: null,
    };

    function createDefaultWallets() {
      return [
        { id: 'wal_cash', name: 'Tiền mặt', type: 'cash', initialBalance: 0, createdBy: 'Hệ thống' },
        { id: 'wal_bank', name: 'Ngân hàng', type: 'bank', initialBalance: 0, createdBy: 'Hệ thống' },
      ];
    }

    let state = {
      wallets: createDefaultWallets(),
      tasks: [],
      transactions: [],
      budgets: [],
      countdowns: [],
    };

    const nowInit = new Date();
    const ui = {
      view: 'dashboard',
      // Việc cần làm
      taskStatusFilter: 'today',
      taskCategoryFilter: 'all',
      taskPriorityFilter: 'all',
      taskMemberFilter: 'all',
      showTaskExtraFilters: false,
      // Thêm nhanh
      quickTaskDate: getTodayISO(0),
      // Lịch biểu
      calYear: nowInit.getFullYear(),
      calMonth: nowInit.getMonth(),
      calSelectedDate: getTodayISO(0),
      calFilter: 'all',
      // Đếm ngược
      countdownFilter: 'upcoming',
      // Sổ thu chi
      trxMonth: getCurrentMonthISO(),
      trxType: 'all',
      trxWallet: 'all',
      trxSearch: '',
      // Ví & Ngân sách
      budgetMonth: getCurrentMonthISO(),
      // Thống kê
      reportMonth: getCurrentMonthISO(),
    };

    let expenseDonutChart = null;
    let sixMonthBarChart = null;
    let countdownTickerId = null;

    /* ========================================================================
       3. HÀM TIỆN ÍCH ĐỊNH DẠNG TIẾNG VIỆT & TÍNH TOÁN
       ======================================================================== */
    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getTodayISO(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getCurrentMonthISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function shiftMonthISO(ym, delta) {
      const [y, m] = (ym || getCurrentMonthISO()).split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function getGreetingByHour() {
      const h = new Date().getHours();
      if (h < 12) return 'Chào buổi sáng';
      if (h < 18) return 'Chào buổi chiều';
      return 'Chào buổi tối';
    }

    function formatVND(amount) {
      const num = Number(amount) || 0;
      const absStr = Math.abs(Math.round(num)).toLocaleString('vi-VN');
      return `${num < 0 ? '-' : ''}${absStr} ₫`;
    }

    function parseVNDInput(raw) {
      const digits = String(raw || '').replace(/[^\d]/g, '');
      return digits ? parseInt(digits, 10) : 0;
    }

    function formatDDMMYYYY(isoDate) {
      if (!isoDate || !isoDate.includes('-')) return '';
      const [y, m, d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    function formatMonthVN(ym) {
      if (!ym || !ym.includes('-')) return '';
      const [y, m] = ym.split('-');
      return `Tháng ${parseInt(m, 10)}/${y}`;
    }

    function formatDateGroupHeader(isoDate) {
      if (!isoDate) return 'Chưa hẹn ngày';
      const today = getTodayISO(0);
      const yesterday = getTodayISO(-1);
      const tomorrow = getTodayISO(1);
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const weekdays = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
      const base = `${weekdays[dt.getDay()]}, ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
      if (isoDate === today) return `Hôm nay · ${base}`;
      if (isoDate === tomorrow) return `Ngày mai · ${base}`;
      if (isoDate === yesterday) return `Hôm qua · ${base}`;
      return base;
    }

    function formatTimeHHMM(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function normalizeSpaceCode(raw) {
      return String(raw || '')
        .toUpperCase()
        .replace(/[^A-Z0-9\-]/g, '')
        .slice(0, 24);
    }

    function makeRandomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return `ED-${s}`;
    }

    function getTaskCategory(catId) {
      return TASK_CATEGORIES.find(c => c.id === catId) || TASK_CATEGORIES[0];
    }

    function getFinanceCategory(type, catId) {
      if (type === 'transfer') return FINANCE_CATEGORIES.transfer[0];
      const list = FINANCE_CATEGORIES[type] || [];
      return list.find(c => c.id === catId) || { id: catId, name: 'Khác', icon: 'tag', color: '#64748B' };
    }

    function getCountdownCategory(catId) {
      return COUNTDOWN_CATEGORIES.find(c => c.id === catId) || COUNTDOWN_CATEGORIES[0];
    }

    // Chỉ hiện nhãn tên thành viên khi người dùng đang bật chế độ Dùng chung
    function getMemberBadgeHTML(memberName) {
      if (syncState.mode !== 'shared' || !memberName || memberName === 'Hệ thống') return '';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-brand-soft text-brand">${escapeHtml(memberName)}</span>`;
    }

    function getCssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function getWalletBalance(walletId) {
      const w = state.wallets.find(item => item.id === walletId);
      if (!w) return 0;
      let bal = Number(w.initialBalance) || 0;
      for (const t of state.transactions) {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income' && t.walletId === walletId) bal += amt;
        else if (t.type === 'expense' && t.walletId === walletId) bal -= amt;
        else if (t.type === 'transfer') {
          if (t.walletId === walletId) bal -= amt;
          if (t.toWalletId === walletId) bal += amt;
        }
      }
      return bal;
    }

    function getTotalBalance() {
      return state.wallets.reduce((sum, w) => sum + getWalletBalance(w.id), 0);
    }

    function getMonthFinanceSummary(monthISO) {
      let income = 0;
      let expense = 0;
      for (const t of state.transactions) {
        if ((t.date || '').startsWith(monthISO)) {
          if (t.type === 'income') income += Number(t.amount) || 0;
          if (t.type === 'expense') expense += Number(t.amount) || 0;
        }
      }
      return { income, expense, net: income - expense };
    }

    function getSpentForCategoryInMonth(categoryId, monthISO) {
      return state.transactions
        .filter(t => t.type === 'expense' && t.categoryId === categoryId && (t.date || '').startsWith(monthISO))
        .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    }

    function getAllMemberNames() {
      const set = new Set([syncState.memberName]);
      state.tasks.forEach(t => t.createdBy && set.add(t.createdBy));
      state.transactions.forEach(t => t.createdBy && set.add(t.createdBy));
      return Array.from(set).filter(n => n && n !== 'Hệ thống');
    }

    /* ========================================================================
       4. LỚP LƯU TRỮ & ĐỒNG BỘ (AN TOÀN RIÊNG TƯ MẶC ĐỊNH + DÙNG CHUNG TÙY CHỌN)
       ======================================================================== */
    function getPrivateItemsCollection() {
      return collection(db, 'artifacts', appId, 'users', currentUser.uid, 'kt_items');
    }

    function getPrivateItemDoc(itemId) {
      return doc(db, 'artifacts', appId, 'users', currentUser.uid, 'kt_items', itemId);
    }

    function getSharedItemsCollection() {
      return collection(db, 'artifacts', appId, 'public', 'data', 'kt_shared_items');
    }

    function getSharedItemDoc(spaceCode, itemId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'kt_shared_items', `${spaceCode}__${itemId}`);
    }

    function getUserPrefsDoc() {
      return doc(db, 'artifacts', appId, 'users', currentUser.uid, 'kt_profile', 'prefs');
    }

    async function saveUserPrefs() {
      if (!db || !currentUser) return;
      try {
        await setDoc(getUserPrefsDoc(), {
          mode: syncState.mode,
          spaceCode: syncState.spaceCode,
          memberName: syncState.memberName,
          theme: syncState.theme,
          hideWelcome: syncState.hideWelcome,
          updatedAt: Date.now(),
        });
      } catch (err) {
        console.error('Lỗi lưu cấu hình:', err);
      }
    }

    async function syncUpsertItem(kind, item, actionLabel = '') {
      if (!db || !currentUser) return;
      try {
        const isShared = syncState.mode === 'shared' && Boolean(syncState.spaceCode);
        const ref = isShared ? getSharedItemDoc(syncState.spaceCode, item.id) : getPrivateItemDoc(item.id);
        await setDoc(ref, {
          spaceCode: isShared ? syncState.spaceCode : 'PRIVATE',
          kind,
          itemId: item.id,
          data: item,
          actionLabel,
          updatedBy: syncState.memberName,
          updatedByUid: currentUser.uid,
          updatedAt: Date.now(),
        });
        syncState.lastSyncedAt = Date.now();
        updateFooterWidgets();
      } catch (err) {
        console.error('Lỗi lưu dữ liệu:', err);
        showToast('Không thể lưu dữ liệu lúc này. Vui lòng kiểm tra mạng.', 'warn');
      }
    }

    async function syncDeleteItem(itemId) {
      if (!db || !currentUser) return;
      try {
        const isShared = syncState.mode === 'shared' && Boolean(syncState.spaceCode);
        const ref = isShared ? getSharedItemDoc(syncState.spaceCode, itemId) : getPrivateItemDoc(itemId);
        await deleteDoc(ref);
        syncState.lastSyncedAt = Date.now();
        updateFooterWidgets();
      } catch (err) {
        console.error('Lỗi xóa dữ liệu:', err);
      }
    }

    function subscribeToActiveScope() {
      if (unsubscribeData) {
        unsubscribeData();
        unsubscribeData = null;
      }
      if (!db || !currentUser) return;

      hasReceivedFirstSnapshot = false;
      lastSnapshotMap.clear();
      syncState.status = 'connecting';
      updateFooterWidgets();

      const isShared = syncState.mode === 'shared' && Boolean(syncState.spaceCode);
      const scopeKey = isShared ? `SHARED:${syncState.spaceCode}` : `PRIVATE:${currentUser.uid}`;
      const colRef = isShared ? getSharedItemsCollection() : getPrivateItemsCollection();

      unsubscribeData = onSnapshot(
        colRef,
        (snapshot) => {
          const wallets = [];
          const tasks = [];
          const transactions = [];
          const budgets = [];
          const countdowns = [];
          const nextMap = new Map();
          const remoteUpdates = [];

          snapshot.forEach((docSnap) => {
            const raw = docSnap.data();
            if (!raw || !raw.data) return;
            if (isShared && raw.spaceCode !== syncState.spaceCode) return;

            const item = raw.data;
            nextMap.set(docSnap.id, raw);

            if (raw.kind === 'wallet') wallets.push(item);
            else if (raw.kind === 'task') tasks.push(item);
            else if (raw.kind === 'transaction') transactions.push(item);
            else if (raw.kind === 'budget') budgets.push(item);
            else if (raw.kind === 'countdown') countdowns.push(item);

            if (isShared && hasReceivedFirstSnapshot && raw.updatedByUid && raw.updatedByUid !== currentUser.uid) {
              const prev = lastSnapshotMap.get(docSnap.id);
              if (!prev || prev.updatedAt !== raw.updatedAt) remoteUpdates.push(raw);
            }
          });

          // Tự tạo 2 ví cơ bản (Tiền mặt, Ngân hàng = 0 ₫) nếu không gian còn mới trắng
          if (wallets.length === 0 && !seededScopes.has(scopeKey)) {
            seededScopes.add(scopeKey);
            const defaults = createDefaultWallets();
            defaults.forEach(w => syncUpsertItem('wallet', w, 'Khởi tạo ví'));
            state.wallets = defaults;
          } else {
            wallets.sort((a, b) => (a.id || '').localeCompare(b.id || ''));
            state.wallets = wallets.length > 0 ? wallets : createDefaultWallets();
          }

          state.tasks = tasks;
          state.transactions = transactions;
          state.budgets = budgets;
          state.countdowns = countdowns;

          lastSnapshotMap.clear();
          nextMap.forEach((v, k) => lastSnapshotMap.set(k, v));

          syncState.status = 'connected';
          syncState.lastSyncedAt = Date.now();

          if (isShared && hasReceivedFirstSnapshot && remoteUpdates.length > 0) {
            const latest = remoteUpdates[remoteUpdates.length - 1];
            const actor = latest.updatedBy || 'Thành viên';
            const detail = latest.actionLabel || 'cập nhật dữ liệu mới';
            showToast(`${actor}: ${detail}`, 'info');
          }

          hasReceivedFirstSnapshot = true;
          renderApp();
        },
        (error) => {
          console.error('Lỗi đồng bộ:', error);
          syncState.status = 'error';
          updateFooterWidgets();
        }
      );
    }

    async function initCloudSync() {
      if (!firebaseConfig) {
        syncState.status = 'local';
        renderApp();
        return;
      }
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // Luôn xác thực trước khi truy vấn dữ liệu
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        currentUser = auth.currentUser;
        if (!currentUser) {
          syncState.status = 'local';
          renderApp();
          return;
        }

        // Tải cấu hình cá nhân trước đó nếu người dùng quay lại
        try {
          const prefSnap = await getDoc(getUserPrefsDoc());
          if (prefSnap.exists()) {
            const p = prefSnap.data();
            if (p.mode === 'shared' && p.spaceCode) {
              syncState.mode = 'shared';
              syncState.spaceCode = normalizeSpaceCode(p.spaceCode);
            } else {
              syncState.mode = 'personal';
            }
            if (p.memberName) syncState.memberName = p.memberName;
            if (typeof p.hideWelcome === 'boolean') syncState.hideWelcome = p.hideWelcome;
            if (p.theme === 'dark' || p.theme === 'light') {
              syncState.theme = p.theme;
              applyTheme(syncState.theme, false);
            }
          }
        } catch (prefErr) {
          console.warn('Dùng cấu hình mặc định:', prefErr);
        }

        subscribeToActiveScope();
      } catch (err) {
        console.error('Lỗi khởi tạo:', err);
        syncState.status = 'local';
        renderApp();
      }
    }

    /* ========================================================================
       5. GIAO DIỆN SÁNG / TỐI & TIỆN ÍCH SAO CHÉP
       ======================================================================== */
    function applyTheme(theme, persist = true) {
      syncState.theme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', syncState.theme);
      const iconName = syncState.theme === 'dark' ? 'sun' : 'moon';
      const dIcon = document.getElementById('theme-icon-desktop');
      const mIcon = document.getElementById('theme-icon-mobile');
      if (dIcon) dIcon.setAttribute('data-lucide', iconName);
      if (mIcon) mIcon.setAttribute('data-lucide', iconName);
      if (window.lucide) lucide.createIcons();
      if (persist) saveUserPrefs();
      if (ui.view === 'reports') setTimeout(() => renderReportCharts(), 0);
    }

    function toggleTheme() {
      applyTheme(syncState.theme === 'dark' ? 'light' : 'dark', true);
    }

    function copyTextToClipboard(text, successMsg = 'Đã sao chép!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg, 'success');
      } catch (err) {
        showToast('Vui lòng bôi đen và sao chép thủ công.', 'warn');
      }
    }

    /* ========================================================================
       7. HÀM VẼ TOÀN BỘ ỨNG DỤNG (GIỮ NGUYÊN CON TRỎ KHI ĐANG GÕ)
       ======================================================================== */
    function renderApp() {
      const activeEl = document.activeElement;
      const keepFocusId = activeEl && (activeEl.id === 'trx-search-input' || activeEl.id === 'quick-task-title') ? activeEl.id : null;
      const keepSelStart = keepFocusId ? activeEl.selectionStart : null;
      const keepSelEnd = keepFocusId ? activeEl.selectionEnd : null;

      const deskNav = document.getElementById('sidebar-nav-desktop');
      const mobNav = document.getElementById('sidebar-nav-mobile');
      const menuHtml = renderSidebarMenuHTML();
      if (deskNav) deskNav.innerHTML = menuHtml;
      if (mobNav) mobNav.innerHTML = menuHtml;

      const mobTitle = document.getElementById('mobile-header-title');
      if (mobTitle) mobTitle.textContent = VIEW_TITLES[ui.view] || 'EVERYDAY';

      updateFooterWidgets();
      renderMobileBottomNav();

      const container = document.getElementById('app-content');
      if (!container) return;

      if (ui.view === 'dashboard') container.innerHTML = renderDashboardView();
      else if (ui.view === 'tasks') container.innerHTML = renderTasksView();
      else if (ui.view === 'calendar') container.innerHTML = renderCalendarView();
      else if (ui.view === 'countdown') container.innerHTML = renderCountdownView();
      else if (ui.view === 'transactions') container.innerHTML = renderTransactionsView();
      else if (ui.view === 'wallets_budgets') container.innerHTML = renderWalletsBudgetsView();
      else if (ui.view === 'reports') {
        container.innerHTML = renderReportsView();
        setTimeout(() => renderReportCharts(), 0);
      }

      if (window.lucide) lucide.createIcons();
      startCountdownTicker();

      if (keepFocusId) {
        const restored = document.getElementById(keepFocusId);
        if (restored) {
          restored.focus();
          if (keepSelStart !== null && restored.setSelectionRange) {
            restored.setSelectionRange(keepSelStart, keepSelEnd);
          }
        }
      }

       8. MÀN HÌNH 1: TỔNG QUAN (ĐƠN GIẢN, SÁNG RÕ, THAO TÁC 1 CHẠM)
       ======================================================================== */

        ...todayTasks.filter(t => !t.completed),

          </section>
        ` : ''}

          <section class="lg:col-span-7 bg-surface rounded-3xl border border-borderline shadow-card p-5">
            <div class="flex items-center justify-between mb-3.5">
              <h3 class="text-[16px] font-bold text-ink-primary">Việc cần làm hôm nay</h3>
              <button onclick="switchView('tasks')" class="text-[13px] font-semibold text-brand hover:underline">Xem tất cả</button>

            ${focusTasks.length === 0 ? `
              <div class="py-10 px-4 text-center rounded-2xl bg-elevated/45">

              <div class="divide-y divide-borderline/70">
                ${focusTasks.slice(0, 7).map(t => renderTaskRow(t)).join('')}
              </div>

          <section class="lg:col-span-5 bg-surface rounded-3xl border border-borderline shadow-card p-5">
            <div class="flex items-center justify-between mb-3.5">
              <h3 class="text-[16px] font-bold text-ink-primary">Thu chi gần đây</h3>

                <p class="text-[14px] font-bold text-ink-primary">Chưa có khoản thu chi nào</p>
                <button onclick="openTransactionModal('expense')" class="mt-3 px-4 py-2 rounded-xl bg-brand text-brand-fg text-[13px] font-semibold hover:bg-brand-hover">

    function dismissWelcomeCard() {
      syncState.hideWelcome = true;
      saveUserPrefs();
      renderApp();
    }

    function renderQuickAddTaskBar() {
      const today = getTodayISO(0);
      const tomorrow = getTodayISO(1);
      return `
        <form onsubmit="submitQuickTask(event)" class="bg-surface rounded-2xl border border-borderline shadow-card p-2.5 sm:p-3 flex flex-col sm:flex-row sm:items-center gap-2.5">
          <div class="flex items-center gap-2.5 flex-1 min-w-0 pl-1">
            <div class="w-8 h-8 rounded-xl bg-brand-soft text-brand flex items-center justify-center flex-shrink-0">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </div>
            <input
              id="quick-task-title"
              type="text"
              placeholder="Bạn cần làm gì hôm nay? Nhập nhanh tại đây..."
              class="w-full bg-transparent text-[14px] text-ink-primary placeholder:text-ink-muted focus:outline-none py-1.5"
            />
          </div>
          <div class="flex items-center justify-between sm:justify-end gap-1.5 pl-10 sm:pl-0">
            <div class="flex items-center gap-1">
              <button type="button" onclick="setQuickTaskDate('${today}')" class="px-2.5 py-1.5 rounded-lg text-[12px] font-semibold transition-colors ${ui.quickTaskDate === today ? 'bg-brand-soft text-brand' : 'text-ink-secondary hover:bg-elevated'}">Hôm nay</button>
              <button type="button" onclick="setQuickTaskDate('${tomorrow}')" class="px-2.5 py-1.5 rounded-lg text-[12px] font-semibold transition-colors ${ui.quickTaskDate === tomorrow ? 'bg-brand-soft text-brand' : 'text-ink-secondary hover:bg-elevated'}">Ngày mai</button>
              <input type="date" value="${ui.quickTaskDate}" onchange="setQuickTaskDate(this.value)" title="Chọn ngày khác" class="kt-input px-2 py-1 text-[12px] tabular-nums w-[124px]" />
            </div>
            <button type="submit" class="px-4 py-2 rounded-xl bg-brand text-brand-fg text-[13px] font-semibold hover:bg-brand-hover flex-shrink-0">Thêm</button>
          </div>
        </form>
      `;
    }

    function setQuickTaskDate(val) {
      ui.quickTaskDate = val || getTodayISO(0);
      renderApp();
    }

    function submitQuickTask(event) {
      event.preventDefault();
      const input = document.getElementById('quick-task-title');
      if (!input) return;
      const title = input.value.trim();
      if (!title) return;

      const task = {
        id: uid('tsk'),
        title,
        description: '',
        dueDate: ui.quickTaskDate || getTodayISO(0),
        dueTime: '',
        categoryId: 'personal',
        priority: 3,
        completed: false,
        financeLink: { enabled: false, type: 'expense', amount: 0, walletId: state.wallets[0]?.id || 'wal_cash', categoryId: 'bills' },
        linkedTrxId: null,
        createdBy: syncState.memberName,
        createdAt: Date.now(),
      };

      state.tasks.unshift(task);
      input.value = '';
      syncUpsertItem('task', task, `Thêm việc "${title}"`);
      renderApp();
      showToast(`Đã thêm việc "${title}".`, 'success');
    }

    /* ========================================================================
       9. MÀN HÌNH 2: VIỆC CẦN LÀM
       ======================================================================== */
    function renderTasksView() {
      const todayISO = getTodayISO(0);
      const members = getAllMemberNames();

      let list = state.tasks.filter(t => {
        if (ui.taskStatusFilter === 'today') return !t.completed && (!t.dueDate || t.dueDate <= todayISO);
        if (ui.taskStatusFilter === 'upcoming') return !t.completed && t.dueDate && t.dueDate > todayISO;
        if (ui.taskStatusFilter === 'pending') return !t.completed;
        if (ui.taskStatusFilter === 'completed') return t.completed;
        return true;
      });

      if (ui.taskCategoryFilter !== 'all') list = list.filter(t => t.categoryId === ui.taskCategoryFilter);
      if (ui.taskPriorityFilter !== 'all') list = list.filter(t => String(t.priority) === String(ui.taskPriorityFilter));
      if (syncState.mode === 'shared' && ui.taskMemberFilter !== 'all') list = list.filter(t => t.createdBy === ui.taskMemberFilter);

      list.sort((a, b) => {
        if (a.completed !== b.completed) return Number(a.completed) - Number(b.completed);
        const da = a.dueDate || '9999-12-31';
        const dbDate = b.dueDate || '9999-12-31';
        if (da !== dbDate) return da.localeCompare(dbDate);
        return (a.priority || 3) - (b.priority || 3);
      });

      const statusTabs = [
        { id: 'today', label: 'Hôm nay' },
        { id: 'upcoming', label: 'Sắp tới' },
        { id: 'pending', label: 'Chưa xong' },
        { id: 'completed', label: 'Đã xong' },
      ];

      const hasActiveExtra = ui.taskCategoryFilter !== 'all' || ui.taskPriorityFilter !== 'all' || (syncState.mode === 'shared' && ui.taskMemberFilter !== 'all');

      return `
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-5">
          <div>
            <h2 class="text-[24px] sm:text-[26px] font-extrabold tracking-[-0.025em] text-ink-primary">Việc cần làm</h2>
            <p class="text-[14px] text-ink-secondary mt-0.5">Ghi chú công việc hằng ngày, tự động đồng bộ lên Lịch biểu</p>
          </div>
          <button onclick="openTaskModal()" class="self-start sm:self-auto px-4 py-2.5 rounded-xl bg-brand text-brand-fg text-[14px] font-semibold hover:bg-brand-hover inline-flex items-center gap-1.5 shadow-card">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Thêm công việc</span>
          </button>
        </div>

        ${renderQuickAddTaskBar()}

        <!-- Thanh tab đơn giản + nút Lọc thêm gọn gàng -->
        <div class="flex flex-wrap items-center justify-between gap-3 my-5">
          <div class="flex flex-wrap items-center gap-1.5 bg-surface p-1.5 rounded-2xl border border-borderline shadow-card">
            ${statusTabs.map(tab => `
              <button onclick="setUiFilter('taskStatusFilter', '${tab.id}')" class="px-3.5 py-1.5 rounded-xl text-[13px] font-semibold transition-colors ${
                ui.taskStatusFilter === tab.id ? 'bg-brand text-brand-fg' : 'text-ink-secondary hover:text-ink-primary'
              }">${tab.label}</button>
            `).join('')}
          </div>

          <button onclick="toggleTaskExtraFilters()" class="px-3.5 py-2 rounded-xl border text-[13px] font-semibold inline-flex items-center gap-1.5 transition-colors ${
            hasActiveExtra || ui.showTaskExtraFilters
              ? 'bg-brand-soft border-brand/30 text-brand'
              : 'bg-surface border-borderline text-ink-secondary hover:text-ink-primary'
          }">
            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
            <span>Lọc thêm${hasActiveExtra ? ' •' : ''}</span>
          </button>
        </div>

        ${ui.showTaskExtraFilters ? `
          <div class="bg-surface rounded-2xl border border-borderline shadow-card p-3.5 mb-5 flex flex-wrap items-center gap-2.5 animate-in">
            <select onchange="setUiFilter('taskCategoryFilter', this.value)" class="kt-input px-3 py-2 text-[13px]">
              <option value="all">Tất cả nhóm việc</option>
              ${TASK_CATEGORIES.map(c => `<option value="${c.id}" ${ui.taskCategoryFilter === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
            <select onchange="setUiFilter('taskPriorityFilter', this.value)" class="kt-input px-3 py-2 text-[13px]">
              <option value="all">Mọi mức ưu tiên</option>
              ${[1, 2, 3, 4].map(lv => `<option value="${lv}" ${String(ui.taskPriorityFilter) === String(lv) ? 'selected' : ''}>${PRIORITIES[lv].label}</option>`).join('')}
            </select>
            ${syncState.mode === 'shared' ? `
              <select onchange="setUiFilter('taskMemberFilter', this.value)" class="kt-input px-3 py-2 text-[13px]">
                <option value="all">Mọi thành viên</option>
                ${members.map(m => `<option value="${escapeHtml(m)}" ${ui.taskMemberFilter === m ? 'selected' : ''}>Của ${escapeHtml(m)}</option>`).join('')}
              </select>
            ` : ''}
            ${hasActiveExtra ? `<button onclick="resetTaskExtraFilters()" class="text-[13px] font-semibold text-brand hover:underline px-2">Xóa bộ lọc</button>` : ''}
          </div>
        ` : ''}

        <!-- Danh sách công việc -->
        <section class="bg-surface rounded-3xl border border-borderline shadow-card overflow-hidden">
          ${list.length === 0 ? `
            <div class="py-14 px-5 text-center">
              <div class="w-12 h-12 rounded-2xl bg-elevated text-ink-muted flex items-center justify-center mx-auto mb-3">
                <i data-lucide="clipboard-check" class="w-6 h-6"></i>
              </div>
              <p class="text-[15px] font-bold text-ink-primary">Không có công việc nào ở mục này</p>
              <p class="text-[13px] text-ink-secondary mt-1">Bấm <strong>Thêm công việc</strong> hoặc gõ nhanh vào ô phía trên để tạo mới.</p>
            </div>
          ` : `
            <div class="divide-y divide-borderline/75 px-4 sm:px-5">
              ${list.map(t => renderTaskRow(t)).join('')}
            </div>
          `}
        </section>
      `;
    }

    function toggleTaskExtraFilters() {
      ui.showTaskExtraFilters = !ui.showTaskExtraFilters;
      renderApp();
    }

    function resetTaskExtraFilters() {
      ui.taskCategoryFilter = 'all';
      ui.taskPriorityFilter = 'all';
      ui.taskMemberFilter = 'all';
      renderApp();
    }

    function renderTaskRow(task) {
      const cat = getTaskCategory(task.categoryId);
      const prio = PRIORITIES[task.priority] || PRIORITIES[3];
      const todayISO = getTodayISO(0);
      const isOverdue = !task.completed && task.dueDate && task.dueDate < todayISO;
      const hasFin = task.financeLink && task.financeLink.enabled && Number(task.financeLink.amount) > 0;

      return `
        <div class="py-3.5 flex items-start gap-3">
          <button
            onclick="toggleTaskComplete('${task.id}')"
            title="${task.completed ? 'Đánh dấu chưa xong' : 'Đánh dấu hoàn thành'}"
            class="mt-0.5 w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors ${
              task.completed ? 'bg-income border-income text-white' : 'hover:bg-elevated'
            }"
            style="${task.completed ? '' : `border-color:${prio.color}`}"
          >
            ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
          </button>

          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <p class="text-[15px] font-semibold leading-snug ${task.completed ? 'line-through text-ink-muted' : 'text-ink-primary'}">
                ${escapeHtml(task.title)}
              </p>
              <div class="flex items-center gap-0.5 flex-shrink-0">
                <button onclick="openTaskModal('${task.id}')" title="Sửa" class="p-1.5 rounded-lg text-ink-muted hover:text-ink-primary hover:bg-elevated">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button onclick="deleteTask('${task.id}')" title="Xóa" class="p-1.5 rounded-lg text-ink-muted hover:text-expense hover:bg-rose-500/10">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            ${task.description ? `<p class="text-[13px] text-ink-secondary mt-0.5 line-clamp-2">${escapeHtml(task.description)}</p>` : ''}

            <div class="flex flex-wrap items-center gap-2 mt-2">
              ${task.dueDate ? `
                <span class="tabular-nums inline-flex items-center gap-1 text-[12px] font-medium ${isOverdue ? 'text-expense font-semibold' : 'text-ink-secondary'}">
                  <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                  <span>${formatDDMMYYYY(task.dueDate)}${task.dueTime ? ` · ${task.dueTime}` : ''}${isOverdue ? ' (Quá hạn)' : ''}</span>
                </span>
              ` : ''}

              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold" style="background-color:${cat.color}16; color:${cat.color}">
                <span>${cat.name}</span>
              </span>

              ${task.priority <= 2 ? `
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold" style="background-color:${prio.bg}; color:${prio.color}">
                  ${prio.label}
                </span>
              ` : ''}

              ${hasFin ? `
                <span class="tabular-nums inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold ${
                  task.financeLink.type === 'income' ? 'bg-emerald-500/15 text-income' : 'bg-rose-500/15 text-expense'
                }">
                  <i data-lucide="coins" class="w-3 h-3"></i>
                  <span>${task.financeLink.type === 'income' ? '+' : '-'}${formatVND(task.financeLink.amount)}</span>
                </span>
              ` : ''}

              ${getMemberBadgeHTML(task.createdBy)}
            </div>
          </div>
        </div>
      `;
    }

    function toggleTaskComplete(taskId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;

      const becomingDone = !task.completed;
      task.completed = becomingDone;

      const fl = task.financeLink;
      let autoTrx = null;

      if (becomingDone && fl && fl.enabled && Number(fl.amount) > 0 && !task.linkedTrxId) {
        autoTrx = {
          id: uid('trx'),
          type: fl.type || 'expense',
          amount: Number(fl.amount),
          walletId: fl.walletId || state.wallets[0]?.id || 'wal_cash',
          categoryId: fl.categoryId || (fl.type === 'income' ? 'other_inc' : 'bills'),
          date: getTodayISO(0),
          note: `${task.title}`,
          createdBy: syncState.memberName,
          createdAt: Date.now(),
        };
        task.linkedTrxId = autoTrx.id;
        state.transactions.unshift(autoTrx);
        syncUpsertItem('transaction', autoTrx, `Tự động ghi từ việc "${task.title}"`);
      }

      syncUpsertItem('task', task, becomingDone ? `Hoàn thành "${task.title}"` : `Mở lại "${task.title}"`);
      renderApp();

      if (autoTrx) {
        const trxIdToUndo = autoTrx.id;
        showToast(
          `Đã xong & tự động ghi ${autoTrx.type === 'income' ? 'thu' : 'chi'} ${formatVND(autoTrx.amount)}.`,
          'success',
          () => {
            task.completed = false;
            task.linkedTrxId = null;
            state.transactions = state.transactions.filter(x => x.id !== trxIdToUndo);
            syncUpsertItem('task', task, `Hoàn tác "${task.title}"`);
            syncDeleteItem(trxIdToUndo);
            renderApp();
          }
        );
      } else {
        showToast(becomingDone ? `Đã hoàn thành "${task.title}".` : `Đã chuyển lại chưa xong.`, 'info');
      }
    }

    function deleteTask(taskId) {
      const idx = state.tasks.findIndex(t => t.id === taskId);
      if (idx === -1) return;
      const removed = state.tasks[idx];
      state.tasks.splice(idx, 1);
      syncDeleteItem(taskId);
      renderApp();
      showToast(`Đã xóa "${removed.title}".`, 'info', () => {
        state.tasks.splice(idx, 0, removed);
        syncUpsertItem('task', removed, `Khôi phục "${removed.title}"`);
        renderApp();
      });
    }

    /* ========================================================================
       10. MÀN HÌNH 3: LỊCH BIỂU
       ======================================================================== */
    function renderCalendarView() {
      const year = ui.calYear;
      const month = ui.calMonth;
      const todayISO = getTodayISO(0);

      const firstDayOfMonth = new Date(year, month, 1);
      const startOffset = (firstDayOfMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

      const filteredTasks = state.tasks.filter(t => {
        if (!t.dueDate) return false;
        if (ui.calFilter === 'pending') return !t.completed;
        return true;
      });

      const tasksByDate = {};
      for (const t of filteredTasks) {
        if (!tasksByDate[t.dueDate]) tasksByDate[t.dueDate] = [];

      Object.values(tasksByDate).forEach(arr => arr.sort((a, b) => Number(a.completed) - Number(b.completed) || (a.priority - b.priority)));

      for (let i = 0; i < totalCells; i++) {

          dayNum: cellDate.getDate(),
          inCurrentMonth: cellDate.getMonth() === month,

          tasks: tasksByDate[iso] || [],

            <button onclick="setUiFilter('calFilter', 'pending')" class="px-3.5 py-1.5 rounded-xl text-[13px] font-semibold ${ui.calFilter === 'pending' ? 'bg-brand text-brand-fg' : 'text-ink-secondary'}">Chưa xong</button>

          <section class="xl:col-span-8 bg-surface rounded-3xl border border-borderline shadow-card overflow-hidden">

              <div class="flex items-center gap-1.5">
                <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl hover:bg-elevated text-ink-primary" aria-label="Tháng trước">

                </button>

                <div class="py-2.5 text-center text-[12px] font-bold ${i >= 5 ? 'text-expense' : 'text-ink-secondary'}">${wd}</div>
              `).join('')}
            </div>

            <div class="grid grid-cols-7 divide-x divide-y divide-borderline/80">
              ${cells.map(cell => {
                const cdPills = cell.countdowns.slice(0, 1);
                const visibleTasks = cell.tasks.slice(0, Math.max(0, 3 - cdPills.length));

                    }"
                  >
                    <div class="flex items-center justify-between mb-1">
                      <span class="tabular-nums text-[12px] sm:text-[13px] font-bold w-6 h-6 rounded-full inline-flex items-center justify-center ${
                        cell.isToday
                          ? 'bg-brand text-brand-fg'
                          : (cell.inCurrentMonth ? 'text-ink-primary' : 'text-ink-muted')

                      ${cell.countdowns.length > 0 ? `<i data-lucide="hourglass" class="w-3 h-3 sm:hidden" style="color:${getCountdownCategory(cell.countdowns[0].category).color}"></i>` : ''}

                    <div class="flex sm:hidden flex-wrap gap-1 mt-auto pt-1">

                            <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background-color:${p.color}"></span>

                      }).join('')}
                      ${extraCount > 0 ? `<div class="text-[11px] font-semibold text-ink-secondary px-1 tabular-nums">+${extraCount} nữa</div>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Bảng chi tiết ngày chọn -->
          <section class="xl:col-span-4 bg-surface rounded-3xl border border-borderline shadow-card p-5 sticky top-6">
            <div class="pb-3.5 border-b border-borderline">
              <span class="text-[12px] font-semibold text-ink-muted">Ngày đang chọn</span>
              <h3 class="text-[16px] font-bold text-ink-primary mt-0.5 tabular-nums">${formatDateGroupHeader(ui.calSelectedDate)}</h3>
            </div>

            ${selectedDayCountdowns.length > 0 ? `
              <div class="mt-4 space-y-2">
                ${selectedDayCountdowns.map(cd => {
                  const cdCat = getCountdownCategory(cd.category);
                  const cdInfo = getCountdownBreakdown(cd);
                  const badgeText = cdInfo.status === 'today' ? 'Hôm nay!' : (cdInfo.status === 'upcoming' ? `Còn ${cdInfo.calendarDaysLeft} ngày` : `Đã qua ${cdInfo.passedDays} ngày`);
                  return `
                    <div class="p-3 rounded-2xl flex items-center justify-between gap-2" style="background-color:${cdCat.color}12">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color:${cdCat.color}22; color:${cdCat.color}">
                          <i data-lucide="${cdCat.icon}" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                          <p class="text-[13px] font-bold text-ink-primary truncate">${escapeHtml(cd.title)}</p>
                          <p class="text-[11px] font-semibold tabular-nums" style="color:${cdCat.color}">${badgeText}</p>
                        </div>
                      </div>
                      <button onclick="openCountdownModal('${cd.id}')" class="p-1.5 rounded-lg text-ink-secondary hover:bg-surface">

            <div class="my-4">
              ${selectedDayTasks.length === 0 ? `

                  <p class="text-[12px] text-ink-secondary mt-1">Thêm lịch trình hoặc đặt đếm ngược cho ngày này.</p>
                </div>
              ` : `
                <div class="divide-y divide-borderline/70 max-h-[360px] overflow-y-auto pr-1">
                  ${selectedDayTasks.map(task => renderTaskRow(task)).join('')}

            <div class="space-y-2">

                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Thêm việc ngày ${formatDDMMYYYY(ui.calSelectedDate)}</span>
              </button>
              <button onclick="openCountdownModal(null, '${ui.calSelectedDate}')" class="w-full py-2.5 px-4 rounded-xl bg-elevated hover:bg-borderline/60 text-[13px] font-semibold text-ink-primary flex items-center justify-center gap-2">

    function changeCalendarMonth(delta) {
      let m = ui.calMonth + delta;
      let y = ui.calYear;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      ui.calMonth = m;
      ui.calYear = y;
      renderApp();
    }

    function goToTodayCalendar() { selectCalendarDate(getTodayISO(0)); }

    function selectCalendarDate(isoDate) {
      ui.calSelectedDate = isoDate;
      const [y, m] = isoDate.split('-').map(Number);
      ui.calYear = y;
      ui.calMonth = m - 1;
      renderApp();
    }

    /* ========================================================================
       11. MÀN HÌNH 4: ĐẾM NGƯỢC
       ======================================================================== */
    function getCountdownsOnDate(isoDate) {
      if (!isoDate) return [];
      const md = isoDate.slice(5);
      return state.countdowns.filter(cd => cd.date && (cd.repeatYearly ? cd.date.slice(5) === md : cd.date === isoDate));
    }

    function getCountdownBreakdown(cd, now = new Date()) {
      const todayISO = getTodayISO(0);
      const [origY, origM, origD] = (cd.date || todayISO).split('-').map(Number);
      const [hh, mm] = (cd.time || '00:00').split(':').map(Number);

      let targetY = origY;
      if (cd.repeatYearly) {
        const thisYear = now.getFullYear();
        const thisYearISO = `${thisYear}-${String(origM).padStart(2, '0')}-${String(origD).padStart(2, '0')}`;
        targetY = thisYearISO < todayISO ? thisYear + 1 : thisYear;
      }

      const targetISO = `${targetY}-${String(origM).padStart(2, '0')}-${String(origD).padStart(2, '0')}`;
      const targetDateTime = new Date(targetY, origM - 1, origD, hh || 0, mm || 0, 0);
      const diffMs = targetDateTime.getTime() - now.getTime();

      const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const targetMid = new Date(targetY, origM - 1, origD).getTime();
      const calendarDaysDiff = Math.round((targetMid - todayMid) / 86400000);

      if (diffMs > 0) {
        return {
          status: 'upcoming',
          targetISO,
          diffMs,
          days: Math.floor(diffMs / 86400000),
          hours: Math.floor((diffMs % 86400000) / 3600000),
          minutes: Math.floor((diffMs % 3600000) / 60000),
          seconds: Math.floor((diffMs % 60000) / 1000),
          calendarDaysLeft: Math.max(0, calendarDaysDiff),
          passedDays: 0,
        };
      }
      if (targetISO === todayISO) {
        return { status: 'today', targetISO, diffMs: 0, days: 0, hours: 0, minutes: 0, seconds: 0, calendarDaysLeft: 0, passedDays: 0 };
      }
      return { status: 'past', targetISO, diffMs, days: 0, hours: 0, minutes: 0, seconds: 0, calendarDaysLeft: 0, passedDays: Math.max(1, Math.abs(calendarDaysDiff)) };
    }

    function getFeaturedCountdown() {
      const now = new Date();
      const upcoming = state.countdowns
        .map(cd => ({ cd, info: getCountdownBreakdown(cd, now) }))
        .filter(item => item.info.status !== 'past')
        .sort((a, b) => (Boolean(b.cd.pinned) - Boolean(a.cd.pinned)) || (a.info.diffMs - b.info.diffMs));
      return upcoming.length > 0 ? upcoming[0].cd : null;
    }

    function startCountdownTicker() {
      if (countdownTickerId) clearInterval(countdownTickerId);
      countdownTickerId = setInterval(updateLiveCountdowns, 1000);
    }

    function updateLiveCountdowns() {
      const nodes = document.querySelectorAll('[data-cd-live]');
      if (!nodes.length) return;
      const now = new Date();
      nodes.forEach(node => {
        const id = node.getAttribute('data-cd-live');
        const cd = state.countdowns.find(item => item.id === id);
        if (!cd) return;
        const info = getCountdownBreakdown(cd, now);
        if (info.status !== 'upcoming') return;
        const dEl = node.querySelector('.cd-days');
        const hEl = node.querySelector('.cd-hours');
        const mEl = node.querySelector('.cd-mins');
        const sEl = node.querySelector('.cd-secs');
        const inlineEl = node.querySelector('.cd-inline');
        if (dEl) dEl.textContent = info.days;
        if (hEl) hEl.textContent = String(info.hours).padStart(2, '0');
        if (mEl) mEl.textContent = String(info.minutes).padStart(2, '0');
        if (sEl) sEl.textContent = String(info.seconds).padStart(2, '0');
        if (inlineEl) inlineEl.textContent = `${String(info.hours).padStart(2, '0')}:${String(info.minutes).padStart(2, '0')}:${String(info.seconds).padStart(2, '0')}`;
      });
    }

    function renderCountdownView() {
      const now = new Date();
      const enriched = state.countdowns.map(cd => ({ cd, info: getCountdownBreakdown(cd, now) }));
      const upcomingItems = enriched.filter(x => x.info.status !== 'past').sort((a, b) => (Boolean(b.cd.pinned) - Boolean(a.cd.pinned)) || (a.info.diffMs - b.info.diffMs));
      const pastItems = enriched.filter(x => x.info.status === 'past').sort((a, b) => a.info.passedDays - b.info.passedDays);
      const listToShow = ui.countdownFilter === 'upcoming' ? upcomingItems : (ui.countdownFilter === 'past' ? pastItems : [...upcomingItems, ...pastItems]);

      const heroItem = (ui.countdownFilter !== 'past' && upcomingItems.length > 0) ? upcomingItems[0] : null;
      const gridItems = heroItem ? listToShow.filter(x => x.cd.id !== heroItem.cd.id) : listToShow;

      return `
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
          <div>
            <h2 class="text-[24px] sm:text-[26px] font-extrabold tracking-[-0.025em] text-ink-primary">Đếm ngược</h2>
            <p class="text-[14px] text-ink-secondary mt-0.5">Theo dõi các ngày sinh nhật, kỷ niệm, chuyến đi và cột mốc đáng nhớ</p>
          </div>
          <div class="flex flex-wrap items-center gap-2 self-start md:self-auto">
            <div class="flex items-center gap-1 bg-surface p-1.5 rounded-2xl border border-borderline shadow-card">
              <button onclick="setUiFilter('countdownFilter', 'upcoming')" class="px-3 py-1.5 rounded-xl text-[13px] font-semibold ${ui.countdownFilter === 'upcoming' ? 'bg-brand text-brand-fg' : 'text-ink-secondary'}">Sắp tới (${upcomingItems.length})</button>
              <button onclick="setUiFilter('countdownFilter', 'all')" class="px-3 py-1.5 rounded-xl text-[13px] font-semibold ${ui.countdownFilter === 'all' ? 'bg-brand text-brand-fg' : 'text-ink-secondary'}">Tất cả (${enriched.length})</button>
              <button onclick="setUiFilter('countdownFilter', 'past')" class="px-3 py-1.5 rounded-xl text-[13px] font-semibold ${ui.countdownFilter === 'past' ? 'bg-brand text-brand-fg' : 'text-ink-secondary'}">Đã qua (${pastItems.length})</button>
            </div>
            <button onclick="openCountdownModal()" class="px-4 py-2.5 rounded-xl bg-brand text-brand-fg text-[14px] font-semibold hover:bg-brand-hover inline-flex items-center gap-1.5 shadow-card">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Thêm ngày</span>
            </button>
          </div>
        </div>

        ${enriched.length === 0 ? `
          <section class="bg-surface rounded-3xl border border-borderline shadow-card py-14 px-5 text-center">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/15 text-warn flex items-center justify-center mx-auto mb-4">
              <i data-lucide="hourglass" class="w-7 h-7"></i>
            </div>
            <h3 class="text-[18px] font-bold text-ink-primary">Chưa có ngày đếm ngược nào</h3>
            <p class="text-[14px] text-ink-secondary mt-1.5 max-w-md mx-auto">Chọn nhanh một gợi ý bên dưới hoặc tự tạo ngày quan trọng của riêng bạn:</p>
            <div class="flex flex-wrap items-center justify-center gap-2 mt-5">
              <button onclick="openCountdownModal(null, null, 'Sinh nhật', 'birthday')" class="px-4 py-2 rounded-xl bg-elevated hover:bg-borderline/60 text-[13px] font-semibold text-ink-primary inline-flex items-center gap-1.5">
                <i data-lucide="cake" class="w-4 h-4 text-warn"></i><span>Sinh nhật</span>
              </button>
              <button onclick="openCountdownModal(null, null, 'Chuyến du lịch', 'travel')" class="px-4 py-2 rounded-xl bg-elevated hover:bg-borderline/60 text-[13px] font-semibold text-ink-primary inline-flex items-center gap-1.5">
                <i data-lucide="plane" class="w-4 h-4 text-brand"></i><span>Du lịch</span>
              </button>
              <button onclick="openCountdownModal(null, null, 'Ngày kỷ niệm', 'anniversary')" class="px-4 py-2 rounded-xl bg-elevated hover:bg-borderline/60 text-[13px] font-semibold text-ink-primary inline-flex items-center gap-1.5">
                <i data-lucide="heart" class="w-4 h-4 text-expense"></i><span>Kỷ niệm</span>
              </button>
              <button onclick="openCountdownModal()" class="px-4 py-2 rounded-xl bg-brand text-brand-fg text-[13px] font-semibold hover:bg-brand-hover inline-flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i><span>Tạo mới</span>
              </button>
            </div>
          </section>
        ` : `
          ${heroItem ? renderCountdownHeroCard(heroItem.cd, heroItem.info) : ''}
          ${gridItems.length === 0 && !heroItem ? `
            <div class="bg-surface rounded-3xl border border-borderline shadow-card py-12 px-4 text-center">
              <p class="text-[15px] font-semibold text-ink-primary">Không có sự kiện nào trong mục này</p>
            </div>
          ` : ''}
          ${gridItems.length > 0 ? `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 ${heroItem ? 'mt-5' : ''}">
              ${gridItems.map(item => renderCountdownCard(item.cd, item.info)).join('')}
            </div>
          ` : ''}
        `}
      `;
    }

    function renderCountdownHeroCard(cd, info) {
      const cat = getCountdownCategory(cd.category);
      return `
        <section class="bg-surface rounded-3xl border border-borderline shadow-card p-6 sm:p-7 relative overflow-hidden" data-cd-live="${cd.id}">
          <div class="absolute top-0 left-0 right-0 h-1.5" style="background-color:${cat.color}"></div>
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
            <div class="space-y-2.5 max-w-xl">
              <div class="flex flex-wrap items-center gap-2">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[12px] font-semibold" style="background-color:${cat.color}18; color:${cat.color}">
                  <i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>
                  <span>${cat.name}</span>
                </span>
                ${cd.pinned ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-500/15 text-warn text-[12px] font-semibold">Đã ghim</span>` : ''}
                ${cd.repeatYearly ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-elevated text-ink-secondary text-[12px] font-medium">Hằng năm</span>` : ''}
              </div>

              <h3 class="text-[22px] sm:text-[26px] font-extrabold tracking-[-0.025em] text-ink-primary leading-tight">${escapeHtml(cd.title)}</h3>
              <p class="text-[14px] font-medium text-ink-secondary tabular-nums">${formatDateGroupHeader(info.targetISO)}${cd.time && cd.time !== '00:00' ? ` · ${cd.time}` : ''}</p>
              ${cd.note ? `<p class="text-[13px] text-ink-secondary">${escapeHtml(cd.note)}</p>` : ''}

              <div class="flex flex-wrap items-center gap-2 pt-2">
                <button onclick="jumpToCalendarFromCountdown('${info.targetISO}')" class="px-3.5 py-1.5 rounded-xl bg-elevated hover:bg-borderline/60 text-[12px] font-semibold text-ink-primary inline-flex items-center gap-1.5">
                  <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i><span>Xem trên lịch</span>
                </button>
                <button onclick="togglePinCountdown('${cd.id}')" class="px-3.5 py-1.5 rounded-xl bg-elevated hover:bg-borderline/60 text-[12px] font-semibold text-ink-secondary hover:text-ink-primary">
                  ${cd.pinned ? 'Bỏ ghim' : 'Ghim lên đầu'}
                </button>
                <button onclick="openCountdownModal('${cd.id}')" class="px-3.5 py-1.5 rounded-xl bg-elevated hover:bg-borderline/60 text-[12px] font-semibold text-ink-secondary hover:text-ink-primary">Sửa</button>
                <button onclick="deleteCountdown('${cd.id}')" class="px-3.5 py-1.5 rounded-xl hover:bg-rose-500/10 text-[12px] font-semibold text-expense">Xóa</button>
              </div>
            </div>

            <div class="flex-shrink-0">
              ${info.status === 'today' ? `
                <div class="px-7 py-6 rounded-2xl bg-emerald-500/15 text-center">
                  <span class="block text-[26px] font-extrabold text-income">Hôm nay!</span>
                  <span class="text-[13px] font-medium text-ink-secondary mt-1 block">Chúc bạn một ngày thật trọn vẹn</span>
                </div>
              ` : `
                <div class="grid grid-cols-4 gap-2 sm:gap-3 tabular-nums">
                  <div class="px-3 sm:px-4 py-3.5 rounded-2xl bg-elevated text-center min-w-[66px] sm:min-w-[82px]">
                    <span class="cd-days block text-[26px] sm:text-[34px] font-extrabold text-ink-primary leading-none">${info.days}</span>
                    <span class="block text-[11px] sm:text-[12px] font-semibold text-ink-secondary mt-1.5">Ngày</span>
                  </div>
                  <div class="px-3 sm:px-4 py-3.5 rounded-2xl bg-elevated text-center min-w-[66px] sm:min-w-[82px]">
                    <span class="cd-hours block text-[26px] sm:text-[34px] font-extrabold text-ink-primary leading-none">${String(info.hours).padStart(2, '0')}</span>
                    <span class="block text-[11px] sm:text-[12px] font-semibold text-ink-secondary mt-1.5">Giờ</span>
                  </div>
                  <div class="px-3 sm:px-4 py-3.5 rounded-2xl bg-elevated text-center min-w-[66px] sm:min-w-[82px]">
                    <span class="cd-mins block text-[26px] sm:text-[34px] font-extrabold text-ink-primary leading-none">${String(info.minutes).padStart(2, '0')}</span>
                    <span class="block text-[11px] sm:text-[12px] font-semibold text-ink-secondary mt-1.5">Phút</span>
                  </div>
                  <div class="px-3 sm:px-4 py-3.5 rounded-2xl bg-elevated text-center min-w-[66px] sm:min-w-[82px]">
                    <span class="cd-secs block text-[26px] sm:text-[34px] font-extrabold text-ink-primary leading-none">${String(info.seconds).padStart(2, '0')}</span>
                    <span class="block text-[11px] sm:text-[12px] font-semibold text-ink-secondary mt-1.5">Giây</span>
                  </div>
                </div>
              `}
            </div>
          </div>
        </section>
      `;
    }

    function renderCountdownCard(cd, info) {
      const cat = getCountdownCategory(cd.category);
      const isPast = info.status === 'past';
      const isToday = info.status === 'today';

      return `
        <article class="bg-surface rounded-3xl border border-borderline shadow-card p-5 flex flex-col justify-between" data-cd-live="${cd.id}">
          <div>
            <div class="flex items-start justify-between gap-2 mb-3">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color:${cat.color}18; color:${cat.color}">
                  <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
                </div>
                <div class="min-w-0">
                  <span class="text-[11px] font-semibold" style="color:${cat.color}">${cat.name}</span>
                  <h4 class="text-[15px] font-bold text-ink-primary truncate">${escapeHtml(cd.title)}</h4>
                </div>
              </div>
              <div class="flex items-center gap-0.5 flex-shrink-0">
                <button onclick="togglePinCountdown('${cd.id}')" class="p-1.5 rounded-lg ${cd.pinned ? 'text-warn bg-amber-500/15' : 'text-ink-muted hover:bg-elevated'}"><i data-lucide="pin" class="w-3.5 h-3.5"></i></button>
                <button onclick="openCountdownModal('${cd.id}')" class="p-1.5 rounded-lg text-ink-muted hover:text-ink-primary hover:bg-elevated"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                <button onclick="deleteCountdown('${cd.id}')" class="p-1.5 rounded-lg text-ink-muted hover:text-expense hover:bg-rose-500/10"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>

            <div class="p-3.5 rounded-2xl bg-elevated/70 flex items-baseline justify-between gap-2 my-3 tabular-nums">
              ${isToday ? `
                <span class="text-[18px] font-extrabold text-income">Hôm nay!</span>
              ` : (isPast ? `
                <div><span class="text-[22px] font-extrabold text-ink-secondary">${info.passedDays}</span><span class="text-[13px] text-ink-muted ml-1">ngày trước</span></div>
                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-surface text-ink-muted">Đã qua</span>
              ` : `
                <div><span class="cd-days text-[24px] font-extrabold text-ink-primary">${info.days}</span><span class="text-[13px] font-medium text-ink-secondary ml-1">ngày</span></div>
                <span class="cd-inline text-[13px] font-bold text-ink-secondary">${String(info.hours).padStart(2, '0')}:${String(info.minutes).padStart(2, '0')}:${String(info.seconds).padStart(2, '0')}</span>
              `)}
            </div>
          </div>

          <div class="pt-3 border-t border-borderline/70 flex items-center justify-between text-[12px]">
            <span class="text-ink-secondary tabular-nums">${formatDDMMYYYY(info.targetISO)}${cd.repeatYearly ? ' · Hằng năm' : ''}</span>
            <button onclick="jumpToCalendarFromCountdown('${info.targetISO}')" class="font-semibold text-brand hover:underline">Xem trên lịch</button>
          </div>
        </article>
      `;
    }

    function jumpToCalendarFromCountdown(isoDate) {
      if (isoDate) selectCalendarDate(isoDate);
      switchView('calendar');
    }

    function togglePinCountdown(cdId) {
      const cd = state.countdowns.find(x => x.id === cdId);
      if (!cd) return;
      cd.pinned = !cd.pinned;
      syncUpsertItem('countdown', cd, cd.pinned ? `Ghim "${cd.title}"` : `Bỏ ghim "${cd.title}"`);
      renderApp();
    }

    function deleteCountdown(cdId) {
      const idx = state.countdowns.findIndex(x => x.id === cdId);
      if (idx === -1) return;
      const removed = state.countdowns[idx];
      state.countdowns.splice(idx, 1);
      syncDeleteItem(cdId);
      renderApp();
      showToast(`Đã xóa "${removed.title}".`, 'info', () => {
        state.countdowns.splice(idx, 0, removed);
        syncUpsertItem('countdown', removed, `Khôi phục "${removed.title}"`);
        renderApp();
      });
    }

    /* ========================================================================
       12. MÀN HÌNH 5: SỔ THU CHI (BỘ CHỌN THÁNG TRỰC QUAN + LỌC GỌN)
       ======================================================================== */
    function renderMonthStepperHTML(monthVal, uiKey) {
      return `
        <div class="inline-flex items-center gap-1 bg-surface p-1 rounded-2xl border border-borderline shadow-card">
          <button onclick="stepMonthFilter('${uiKey}', -1)" class="p-2 rounded-xl hover:bg-elevated text-ink-primary" aria-label="Tháng trước">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <span class="px-3 text-[14px] font-bold text-ink-primary tabular-nums min-w-[120px] text-center">${formatMonthVN(monthVal)}</span>
          <button onclick="stepMonthFilter('${uiKey}', 1)" class="p-2 rounded-xl hover:bg-elevated text-ink-primary" aria-label="Tháng sau">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      `;
    }

    function stepMonthFilter(uiKey, delta) {
      ui[uiKey] = shiftMonthISO(ui[uiKey], delta);
      renderApp();
    }

    function renderTransactionsView() {
      const monthSum = getMonthFinanceSummary(ui.trxMonth);
      const q = (ui.trxSearch || '').trim().toLowerCase();

      let list = state.transactions.filter(t => {
        if (ui.trxMonth && !(t.date || '').startsWith(ui.trxMonth)) return false;
        if (ui.trxType !== 'all' && t.type !== ui.trxType) return false;
        if (ui.trxWallet !== 'all' && t.walletId !== ui.trxWallet && t.toWalletId !== ui.trxWallet) return false;
        if (q) {
          const cat = getFinanceCategory(t.type, t.categoryId);
          if (!(t.note || '').toLowerCase().includes(q) && !cat.name.toLowerCase().includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));

      const grouped = {};
      for (const t of list) {
        const key = t.date || 'Khác';
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(t);
      }
      const dateKeys = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

      return `
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-5">
          <div>
            <h2 class="text-[24px] sm:text-[26px] font-extrabold tracking-[-0.025em] text-ink-primary">Sổ thu chi</h2>
            <p class="text-[14px] text-ink-secondary mt-0.5">Ghi chép thu nhập và chi tiêu hằng ngày theo từng tháng</p>
          </div>
          <div class="flex flex-wrap items-center gap-2 self-start md:self-auto">
            ${renderMonthStepperHTML(ui.trxMonth, 'trxMonth')}
            <button onclick="openTransactionModal('expense')" class="px-4 py-2.5 rounded-xl bg-brand text-brand-fg text-[14px] font-semibold hover:bg-brand-hover inline-flex items-center gap-1.5 shadow-card">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Ghi giao dịch</span>
            </button>
          </div>
        </div>

        <!-- 3 thẻ tóm tắt tháng -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
          <div class="bg-surface rounded-2xl border border-borderline shadow-card p-4">
            <p class="text-[12px] font-semibold text-ink-secondary">Tiền vào (Thu)</p>
            <p class="text-[20px] font-extrabold text-income tabular-nums mt-1">+${formatVND(monthSum.income)}</p>
          </div>
          <div class="bg-surface rounded-2xl border border-borderline shadow-card p-4">
            <p class="text-[12px] font-semibold text-ink-secondary">Tiền ra (Chi)</p>
            <p class="text-[20px] font-extrabold text-expense tabular-nums mt-1">-${formatVND(monthSum.expense)}</p>
          </div>
          <div class="bg-surface rounded-2xl border border-borderline shadow-card p-4">
            <p class="text-[12px] font-semibold text-ink-secondary">Còn lại trong tháng</p>
            <p class="text-[20px] font-extrabold tabular-nums mt-1 ${monthSum.net >= 0 ? 'text-ink-primary' : 'text-expense'}">${monthSum.net > 0 ? '+' : ''}${formatVND(monthSum.net)}</p>
          </div>
        </div>

        <!-- Bộ lọc đơn giản: Thẻ loại + Chọn ví + Tìm kiếm -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-5">
          <div class="flex flex-wrap items-center gap-1.5 bg-surface p-1.5 rounded-2xl border border-borderline shadow-card">
            ${[
              { id: 'all', label: 'Tất cả' },
              { id: 'expense', label: 'Chi tiêu' },
              { id: 'income', label: 'Thu nhập' },
              { id: 'transfer', label: 'Chuyển ví' },
            ].map(tab => `
              <button onclick="setUiFilter('trxType', '${tab.id}')" class="px-3 py-1.5 rounded-xl text-[13px] font-semibold ${ui.trxType === tab.id ? 'bg-brand text-brand-fg' : 'text-ink-secondary'}">${tab.label}</button>
            `).join('')}
          </div>

          <div class="flex flex-wrap sm:flex-nowrap items-center gap-2">
            <select onchange="setUiFilter('trxWallet', this.value)" class="kt-input px-3 py-2 text-[13px]">
              <option value="all">Tất cả ví</option>
              ${state.wallets.map(w => `<option value="${w.id}" ${ui.trxWallet === w.id ? 'selected' : ''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
            <input
              id="trx-search-input"
              type="text"
              value="${escapeHtml(ui.trxSearch)}"
              oninput="handleTrxSearchInput(this.value)"
              placeholder="Tìm ghi chú, hạng mục..."
              class="kt-input px-3.5 py-2 text-[13px] flex-1 sm:w-[210px]"
            />
          </div>
        </div>

        <!-- Danh sách giao dịch gom theo ngày -->
        ${dateKeys.length === 0 ? `
          <section class="bg-surface rounded-3xl border border-borderline shadow-card py-14 px-5 text-center">
            <div class="w-12 h-12 rounded-2xl bg-elevated text-ink-muted flex items-center justify-center mx-auto mb-3">
              <i data-lucide="receipt" class="w-6 h-6"></i>
            </div>
            <p class="text-[15px] font-bold text-ink-primary">Chưa có giao dịch nào trong ${formatMonthVN(ui.trxMonth)}</p>
            <div class="flex items-center justify-center gap-2 mt-4">
              <button onclick="openTransactionModal('expense')" class="px-4 py-2 rounded-xl bg-rose-500/12 text-expense font-bold text-[13px] hover:bg-rose-500/20">+ Ghi khoản chi</button>
              <button onclick="openTransactionModal('income')" class="px-4 py-2 rounded-xl bg-emerald-500/12 text-income font-bold text-[13px] hover:bg-emerald-500/20">+ Ghi khoản thu</button>
            </div>
          </section>
        ` : `
          <div class="space-y-4">
            ${dateKeys.map(dateKey => {
              const items = grouped[dateKey];
              const dayNet = items.reduce((s, it) => it.type === 'income' ? s + (Number(it.amount) || 0) : (it.type === 'expense' ? s - (Number(it.amount) || 0) : s), 0);
              return `
                <section class="bg-surface rounded-3xl border border-borderline shadow-card overflow-hidden">
                  <div class="px-5 py-3 bg-elevated/55 border-b border-borderline flex items-center justify-between gap-2">
                    <span class="text-[13px] font-bold text-ink-primary tabular-nums">${formatDateGroupHeader(dateKey)}</span>
                    <span class="text-[13px] font-bold tabular-nums ${dayNet > 0 ? 'text-income' : (dayNet < 0 ? 'text-expense' : 'text-ink-muted')}">
                      ${dayNet > 0 ? '+' : ''}${formatVND(dayNet)}
                    </span>
                  </div>
                  <div class="divide-y divide-borderline/75 px-5">
                    ${items.map(t => renderFullTransactionRow(t)).join('')}
                  </div>
                </section>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    function renderFullTransactionRow(t) {
      const cat = getFinanceCategory(t.type, t.categoryId);
      const fromW = state.wallets.find(w => w.id === t.walletId)?.name || 'Ví';
      const toW = t.type === 'transfer' ? (state.wallets.find(w => w.id === t.toWalletId)?.name || 'Ví nhận') : '';
      const sign = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');
      const amtCls = t.type === 'income' ? 'text-income' : (t.type === 'expense' ? 'text-expense' : 'text-brand');

      return `
        <div class="py-3.5 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0" style="background-color:${cat.color}18; color:${cat.color}">
              <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <p class="text-[14px] font-bold text-ink-primary truncate">${escapeHtml(cat.name)}</p>
                ${getMemberBadgeHTML(t.createdBy)}
              </div>
              <p class="text-[12px] text-ink-secondary truncate mt-0.5">
                ${t.type === 'transfer' ? `${escapeHtml(fromW)} → ${escapeHtml(toW)}` : escapeHtml(fromW)}${t.note ? ` · ${escapeHtml(t.note)}` : ''}
              </p>
            </div>
          </div>

          <div class="flex items-center gap-1.5 flex-shrink-0">
            <span class="text-[14px] sm:text-[15px] font-bold tabular-nums mr-1 ${amtCls}">${sign}${formatVND(t.amount)}</span>
            <button onclick="openTransactionModal(null, '${t.id}')" title="Sửa" class="p-1.5 rounded-lg text-ink-muted hover:text-ink-primary hover:bg-elevated">
              <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button onclick="deleteTransaction('${t.id}')" title="Xóa" class="p-1.5 rounded-lg text-ink-muted hover:text-expense hover:bg-rose-500/10">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
    }

    function renderCompactTransactionRow(t) {
      const cat = getFinanceCategory(t.type, t.categoryId);
      const sign = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');
      const amtCls = t.type === 'income' ? 'text-income' : (t.type === 'expense' ? 'text-expense' : 'text-brand');
      return `
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color:${cat.color}18; color:${cat.color}">
              <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
            </div>
            <div class="min-w-0">

              </div>
            </div>
            <div class="flex items-center gap-1">

          <div class="flex items-center justify-between text-[12px] mt-2 tabular-nums">
            <span class="font-semibold text-ink-secondary">Đã chi: ${formatVND(spent)} (${pct}%)</span>
            <span class="font-bold ${remain < 0 ? 'text-expense' : 'text-income'}">

    function deleteWallet(walletId) {

      const removed = state.wallets[idx];
      state.wallets.splice(idx, 1);
      syncDeleteItem(walletId);
      renderApp();
      showToast(`Đã xóa ví "${removed.name}".`, 'info', () => {
        state.wallets.splice(idx, 0, removed);
        syncUpsertItem('wallet', removed, `Khôi phục ví "${removed.name}"`);
        renderApp();
      });
    }

    function deleteBudget(budgetId) {
      const idx = state.budgets.findIndex(b => b.id === budgetId);
      if (idx === -1) return;
      const removed = state.budgets[idx];
      state.budgets.splice(idx, 1);
      syncDeleteItem(budgetId);

    function renderReportsView() {

            <p class="text-[22px] font-extrabold text-expense tabular-nums mt-1">-${formatVND(sum.expense)}</p>
          </div>
