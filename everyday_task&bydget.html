            <p class="text-[22px] font-extrabold tabular-nums mt-1 ${saveRate >= 0 ? 'text-ink-primary' : 'text-expense'}">${saveRate}%</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <section class="lg:col-span-5 bg-surface rounded-3xl border border-borderline shadow-card p-5">

              <div class="py-14 text-center text-[13px] text-ink-secondary">Chưa có khoản chi nào trong ${formatMonthVN(ui.reportMonth)}.</div>
            ` : `
              <div class="relative h-[220px] mb-4">
                <canvas id="chart-expense-donut"></canvas>
              </div>
              <div class="space-y-2.5 pt-3 border-t border-borderline">
                ${catBreakdown.slice(0, 6).map(row => {
                  const pct = sum.expense > 0 ? Math.round((row.total / sum.expense) * 100) : 0;
                  return `
                    <div class="flex items-center justify-between text-[13px]">
                      <span class="flex items-center gap-2 min-w-0">
                        <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color:${row.cat.color}"></span>
                        <span class="text-ink-primary font-medium truncate">${escapeHtml(row.cat.name)}</span>

                      <span class="tabular-nums font-bold text-ink-primary flex-shrink-0">${formatVND(row.total)} <span class="text-ink-muted font-medium">(${pct}%)</span></span>

                  `;
                }).join('')}
              </div>
            `}
          </section>

          <section class="lg:col-span-7 bg-surface rounded-3xl border border-borderline shadow-card p-5">
            <h3 class="text-[15px] font-bold text-ink-primary mb-4">Thu &amp; Chi 6 tháng gần đây</h3>
            <div class="relative h-[290px]">
              <canvas id="chart-six-months"></canvas>
            </div>
          </section>
        </div>
      `;
    }

    function renderReportCharts() {
      if (!window.Chart) return;
      Chart.defaults.font.family = '"Be Vietnam Pro", system-ui, sans-serif';
      Chart.defaults.color = getCssVar('--text-secondary') || '#475569';

      if (expenseDonutChart) { expenseDonutChart.destroy(); expenseDonutChart = null; }
      if (sixMonthBarChart) { sixMonthBarChart.destroy(); sixMonthBarChart = null; }

      const donutCanvas = document.getElementById('chart-expense-donut');
      if (donutCanvas) {
        const byCat = {};
        state.transactions
          .filter(t => t.type === 'expense' && (t.date || '').startsWith(ui.reportMonth))
          .forEach(t => { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + (Number(t.amount) || 0); });
        const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

        if (entries.length > 0) {
          expenseDonutChart = new Chart(donutCanvas, {
            type: 'doughnut',
            data: {
              labels: entries.map(([id]) => getFinanceCategory('expense', id).name),
              datasets: [{
                data: entries.map(([, v]) => v),
                backgroundColor: entries.map(([id]) => getFinanceCategory('expense', id).color),
                borderWidth: 2,
                borderColor: getCssVar('--bg-surface') || '#FFFFFF',
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '66%',
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${formatVND(ctx.raw)}` } }
              }
            }
          });
        }
      }

      const barCanvas = document.getElementById('chart-six-months');
      if (barCanvas) {
        const [ry, rm] = ui.reportMonth.split('-').map(Number);
        const labels = [], incData = [], expData = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(ry, rm - 1 - i, 1);
          const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          const s = getMonthFinanceSummary(ym);
          labels.push(`T${d.getMonth() + 1}/${String(d.getFullYear()).slice(2)}`);
          incData.push(s.income);
          expData.push(s.expense);
        }

        sixMonthBarChart = new Chart(barCanvas, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Thu nhập', data: incData, backgroundColor: '#059669', borderRadius: 8, maxBarThickness: 28 },
              { label: 'Chi tiêu', data: expData, backgroundColor: '#E11D48', borderRadius: 8, maxBarThickness: 28 },
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { grid: { display: false } },
              y: {
                beginAtZero: true,
                grid: { color: getCssVar('--border-subtle') || '#E2E8F0' },
                ticks: { callback: (val) => val >= 1000000 ? `${(val / 1000000).toFixed(1)}tr` : (val >= 1000 ? `${Math.round(val / 1000)}k` : val) }
              }
            },
            plugins: {
              legend: { position: 'top', align: 'end' },
              tooltip: { callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${formatVND(ctx.raw)}` } }
            }
          }
        });
      }
    }

    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      if (!overlay || !box) return;
      box.innerHTML = html;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (!overlay) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

      const bPers = document.getElementById('mode-btn-personal');
      const bShar = document.getElementById('mode-btn-shared');
      if (inp) inp.value = mode;
      if (wrap) {
        if (mode === 'shared') { wrap.classList.remove('hidden'); wrap.classList.add('space-y-3', 'pt-1'); }
        else wrap.classList.add('hidden');
      }
      if (bPers) bPers.className = `p-3 rounded-xl border text-left transition-colors ${mode === 'personal' ? 'bg-brand-soft border-brand text-brand' : 'bg-surface border-borderline text-ink-secondary'}`;

    function fillRandomSpaceCode() {
      const el = document.getElementById('set-space-code');
      if (el) el.value = makeRandomCode();
    }

    function submitSyncModeForm(event) {
      event.preventDefault();
      const mode = document.getElementById('set-sync-mode')?.value === 'shared' ? 'shared' : 'personal';
      const memberName = document.getElementById('set-member-name')?.value.trim() || 'Tôi';
      let code = normalizeSpaceCode(document.getElementById('set-space-code')?.value);

      if (mode === 'shared' && !code) {
        code = makeRandomCode();
      }

      const scopeChanged = (mode !== syncState.mode) || (mode === 'shared' && code !== syncState.spaceCode);
      syncState.mode = mode;
      syncState.memberName = memberName;
      if (mode === 'shared') syncState.spaceCode = code;

      saveUserPrefs();
      closeModal();

      if (scopeChanged && db && currentUser) {
        subscribeToActiveScope();
        showToast(mode === 'shared' ? `Đã kết nối phòng dùng chung ${code}.` : 'Đã chuyển về không gian cá nhân riêng tư.', 'success');
      } else {
        updateFooterWidgets();
        renderApp();
        showToast('Đã lưu cài đặt.', 'success');
      }
    }

    function renderSearchResults(query) {
      const box = document.getElementById('global-search-results');
      if (!box) return;
      const q = (query || '').trim().toLowerCase();

      const navActions = [
        { label: 'Tổng quan', icon: 'home', fn: "closeModal(); switchView('dashboard')" },
        { label: 'Việc cần làm', icon: 'check-circle-2', fn: "closeModal(); switchView('tasks')" },
        { label: 'Lịch biểu', icon: 'calendar-days', fn: "closeModal(); switchView('calendar')" },
        { label: 'Đếm ngược', icon: 'hourglass', fn: "closeModal(); switchView('countdown')" },
        { label: 'Sổ thu chi', icon: 'receipt', fn: "closeModal(); switchView('transactions')" },
        { label: 'Ví & Ngân sách', icon: 'wallet', fn: "closeModal(); switchView('wallets_budgets')" },
        { label: 'Thống kê', icon: 'pie-chart', fn: "closeModal(); switchView('reports')" },
      ].filter(a => !q || a.label.toLowerCase().includes(q));

      const matchedTasks = q ? state.tasks.filter(t => (t.title || '').toLowerCase().includes(q)).slice(0, 5) : [];
      const matchedTrx = q ? state.transactions.filter(t => (t.note || '').toLowerCase().includes(q) || getFinanceCategory(t.type, t.categoryId).name.toLowerCase().includes(q)).slice(0, 5) : [];
      const matchedCd = q ? state.countdowns.filter(c => (c.title || '').toLowerCase().includes(q)).slice(0, 4) : [];

      let html = '';
      if (matchedTasks.length) {
        html += `<div><p class="px-2 mb-1 text-[11px] font-bold uppercase text-ink-muted">Công việc</p>${matchedTasks.map(t => `<button onclick="openTaskModal('${t.id}')" class="w-full px-3 py-2 rounded-xl hover:bg-elevated flex justify-between text-left"><span class="text-[14px] font-medium text-ink-primary truncate">${escapeHtml(t.title)}</span><span class="text-[12px] text-ink-muted tabular-nums">${formatDDMMYYYY(t.dueDate)}</span></button>`).join('')}</div>`;
      }
      if (matchedTrx.length) {
        html += `<div><p class="px-2 mb-1 text-[11px] font-bold uppercase text-ink-muted">Thu chi</p>${matchedTrx.map(t => `<button onclick="openTransactionModal(null, '${t.id}')" class="w-full px-3 py-2 rounded-xl hover:bg-elevated flex justify-between text-left"><span class="text-[14px] font-medium text-ink-primary truncate">${escapeHtml(t.note || getFinanceCategory(t.type, t.categoryId).name)}</span><span class="text-[13px] font-bold tabular-nums ${t.type === 'income' ? 'text-income' : 'text-expense'}">${formatVND(t.amount)}</span></button>`).join('')}</div>`;
      }
      if (matchedCd.length) {
        html += `<div><p class="px-2 mb-1 text-[11px] font-bold uppercase text-ink-muted">Đếm ngược</p>${matchedCd.map(c => `<button onclick="openCountdownModal('${c.id}')" class="w-full px-3 py-2 rounded-xl hover:bg-elevated flex justify-between text-left"><span class="text-[14px] font-medium text-ink-primary truncate">${escapeHtml(c.title)}</span><span class="text-[12px] text-ink-muted tabular-nums">${formatDDMMYYYY(c.date)}</span></button>`).join('')}</div>`;
      }
      if (navActions.length) {
        html += `<div><p class="px-2 mb-1 text-[11px] font-bold uppercase text-ink-muted">Đi tới mục</p><div class="grid grid-cols-2 gap-1">${navActions.map(a => `<button onclick="${a.fn}" class="px-3 py-2 rounded-xl hover:bg-elevated flex items-center gap-2 text-left"><i data-lucide="${a.icon}" class="w-4 h-4 text-brand"></i><span class="text-[13px] font-semibold text-ink-primary">${a.label}</span></button>`).join('')}</div></div>`;
      }
      box.innerHTML = html || `<p class="py-6 text-center text-[13px] text-ink-secondary">Không tìm thấy kết quả phù hợp.</p>`;
      if (window.lucide) lucide.createIcons();
    }

            </div>

            <div>
              <label class="block text-[13px] font-semibold text-ink-primary mb-1.5">Nhóm việc</label>

                ${TASK_CATEGORIES.map(c => `<option value="${c.id}" ${(task?.categoryId || 'personal') === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}

            <div>
              <label class="block text-[13px] font-semibold text-ink-primary mb-1.5">Mức độ ưu tiên</label>

                    prioVal === lv ? 'border-brand bg-brand-soft text-brand' : 'border-borderline bg-surface text-ink-secondary hover:bg-elevated'
                  }">${PRIORITIES[lv].label}</button>
                `).join('')}

            </div>

            <div>
              <label class="block text-[13px] font-semibold text-ink-primary mb-1.5">Ghi chú thêm</label>
              <textarea id="tsk-desc" rows="2" placeholder="Chi tiết nếu cần..." class="kt-input w-full px-3.5 py-2">${escapeHtml(task?.description || '')}</textarea>

              <label class="flex items-center justify-between cursor-pointer">

    function selectTaskPriority(lv) {
      const inp = document.getElementById('tsk-priority');
      if (inp) inp.value = lv;
      [1, 2, 3, 4].forEach(i => {
        const b = document.getElementById(`prio-btn-${i}`);
        if (!b) return;
        b.className = `py-2 px-1 rounded-xl border text-[12px] font-bold transition-colors ${
          i === lv ? 'border-brand bg-brand-soft text-brand' : 'border-borderline bg-surface text-ink-secondary hover:bg-elevated'
        }`;
      });
    }

    function toggleTaskFinanceFields() {
      const checked = document.getElementById('tsk-fin-toggle')?.checked;
      const box = document.getElementById('tsk-fin-fields');
      if (!box) return;
      if (checked) { box.classList.remove('hidden'); box.classList.add('mt-3.5', 'pt-3.5', 'border-t', 'border-borderline', 'space-y-3'); }
      else box.classList.add('hidden');
    }

    function updateTaskFinanceCategories() {
      const type = document.getElementById('tsk-fin-type')?.value || 'expense';
      const sel = document.getElementById('tsk-fin-cat');
      if (!sel) return;
      sel.innerHTML = (FINANCE_CATEGORIES[type] || FINANCE_CATEGORIES.expense).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function submitTaskForm(event, taskId) {
      event.preventDefault();
      const title = document.getElementById('tsk-title').value.trim();
      if (!title) return;

      const finEnabled = document.getElementById('tsk-fin-toggle').checked;
      const payload = {
        title,
        description: document.getElementById('tsk-desc').value.trim(),
        dueDate: document.getElementById('tsk-date').value || '',
        dueTime: document.getElementById('tsk-time').value || '',
        categoryId: document.getElementById('tsk-category').value,
        priority: Number(document.getElementById('tsk-priority').value) || 3,
        financeLink: {
          enabled: finEnabled,
          type: document.getElementById('tsk-fin-type')?.value || 'expense',
          amount: finEnabled ? parseVNDInput(document.getElementById('tsk-fin-amount')?.value) : 0,
          walletId: document.getElementById('tsk-fin-wallet')?.value || state.wallets[0]?.id || 'wal_cash',
          categoryId: document.getElementById('tsk-fin-cat')?.value || 'bills',
        },
      };

      if (taskId) {
        const existing = state.tasks.find(t => t.id === taskId);
        if (existing) {
          Object.assign(existing, payload);
          syncUpsertItem('task', existing, `Cập nhật "${title}"`);
        }
        showToast('Đã cập nhật công việc.', 'success');
      } else {
        const created = { id: uid('tsk'), ...payload, completed: false, linkedTrxId: null, createdBy: syncState.memberName, createdAt: Date.now() };
        state.tasks.unshift(created);
        syncUpsertItem('task', created, `Thêm việc "${title}"`);
        showToast(`Đã thêm "${title}".`, 'success');
      }
      closeModal();
      renderApp();
    }

    function exportDataJSON() {
      const payload = { app: 'EVERYDAY', exportedAt: new Date().toISOString(), data: state };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `EVERYDAY_SaoLuu_${getTodayISO(0)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Đã tải xuống tệp sao lưu.', 'success');
    }

    function triggerImportJSON() {
      const inp = document.getElementById('import-json-input');
      if (inp) { inp.value = ''; inp.click(); }
    }

    function handleImportJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsedRaw = JSON.parse(e.target.result);
          const parsed = parsedRaw.data ? parsedRaw.data : parsedRaw;
          if (!Array.isArray(parsed.wallets) || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.transactions)) {
            throw new Error('Invalid');
          }

          const oldIds = [
            ...state.wallets.map(x => x.id),
            ...state.tasks.map(x => x.id),
            ...state.transactions.map(x => x.id),
            ...state.budgets.map(x => x.id),
            ...state.countdowns.map(x => x.id),
          ];

          const restored = {
            wallets: parsed.wallets.length ? parsed.wallets : createDefaultWallets(),
            tasks: parsed.tasks || [],
            transactions: parsed.transactions || [],
            budgets: Array.isArray(parsed.budgets) ? parsed.budgets : [],
            countdowns: Array.isArray(parsed.countdowns) ? parsed.countdowns : [],
          };

          state = restored;
          closeModal();
          renderApp();

          if (db && currentUser) {
            await Promise.all(oldIds.map(id => syncDeleteItem(id)));
            await Promise.all([
              ...restored.wallets.map(x => syncUpsertItem('wallet', x, 'Khôi phục')),
              ...restored.tasks.map(x => syncUpsertItem('task', x, 'Khôi phục')),
              ...restored.transactions.map(x => syncUpsertItem('transaction', x, 'Khôi phục')),
              ...restored.budgets.map(x => syncUpsertItem('budget', x, 'Khôi phục')),
              ...restored.countdowns.map(x => syncUpsertItem('countdown', x, 'Khôi phục')),
            ]);
          }
          showToast('Đã khôi phục dữ liệu thành công.', 'success');
        } catch (err) {
          showToast('Tệp sao lưu không đúng định dạng.', 'warn');
        }
      };
      reader.readAsText(file);
    }

        ...state.transactions.map(x => x.id),
        ...state.budgets.map(x => x.id),
        ...state.countdowns.map(x => x.id),
      ];

      const freshWallets = createDefaultWallets();
      state = { wallets: freshWallets, tasks: [], transactions: [], budgets: [], countdowns: [] };
      closeModal();
      renderApp();

      if (db && currentUser) {
        await Promise.all(idsToRemove.map(id => syncDeleteItem(id)));
        await Promise.all(freshWallets.map(w => syncUpsertItem('wallet', w, 'Khởi tạo ví')));
      }
      showToast('Đã xóa sạch toàn bộ dữ liệu.', 'info');
    }

    function showToast(message, tone = 'info', undoFn = null) {
      const wrap = document.getElementById('toast-container');
      if (!wrap) return;
      const toast = document.createElement('div');
      const dotColor = tone === 'success' ? 'bg-income' : (tone === 'warn' ? 'bg-warn' : 'bg-brand');
      toast.className = 'pointer-events-auto bg-surface border border-borderline shadow-float rounded-2xl px-4 py-3 flex items-center justify-between gap-3 animate-in';
      toast.innerHTML = `
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${dotColor}"></span>
          <span class="text-[13px] font-semibold text-ink-primary leading-snug">${escapeHtml(message)}</span>
        </div>
      `;
      if (typeof undoFn === 'function') {
        const btn = document.createElement('button');
        btn.className = 'text-[12px] font-bold text-brand hover:underline flex-shrink-0 pl-2';
        btn.textContent = 'Hoàn tác';
        btn.onclick = () => { undoFn(); toast.remove(); };
        toast.appendChild(btn);
      }
      wrap.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, undoFn ? 5000 : 3200);
    }

    function setUiFilter(key, val) {
      ui[key] = val;
      renderApp();
    }

    /* ========================================================================
       17. KHỞI CHẠY ỨNG DỤNG
       ======================================================================== */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        toggleMobileMenu(false);
      }
    });

    Object.assign(window, {
      switchView,
      toggleTheme,
      applyTheme,
      toggleMobileMenu,
      setUiFilter,
      stepMonthFilter,
      dismissWelcomeCard,
      openModal,
      closeModal,
      openSettingsModal,
      toggleModeInSettings,
      fillRandomSpaceCode,
      submitSyncModeForm,
      copyTextToClipboard,
      openQuickAddSheet,
      openSearchModal,
      renderSearchResults,
      openTaskModal,
      selectTaskPriority,
      toggleTaskFinanceFields,
      updateTaskFinanceCategories,
      submitTaskForm,
      setQuickTaskDate,
      submitQuickTask,
      toggleTaskExtraFilters,
      resetTaskExtraFilters,
      toggleTaskComplete,
      deleteTask,
      changeCalendarMonth,
      goToTodayCalendar,
      selectCalendarDate,
      openCountdownModal,
      submitCountdownForm,
      togglePinCountdown,
      deleteCountdown,
      jumpToCalendarFromCountdown,
      openTransactionModal,
      setTrxTypeInModal,
      renderTrxCategoryChips,
      formatAmountInput,
      addQuickAmount,
      submitTransactionForm,
      handleTrxSearchInput,
      deleteTransaction,
      openWalletModal,
      submitWalletForm,
      deleteWallet,
      openBudgetModal,
      submitBudgetForm,
      deleteBudget,
      exportDataJSON,
      triggerImportJSON,
      handleImportJSON,
      openClearDataModal,
      confirmClearAllData,
    });

    function initApp() {
      try {
        applyTheme(syncState.theme, false);
        renderApp();
        initCloudSync();
      } catch (err) {
        console.error('Lỗi khởi chạy ứng dụng:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
